kMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="26" font-weight="700" letter-spacing="0" text-anchor="start" x="24" y="169">你的移动硬盘。</text><rect fill="#F8F1EA" height="155" opacity="1" rx="25" stroke="#EDE6DE" stroke-width="0.9" width="345" x="24" y="224" /><g transform="translate(244,189) scale(0.85)"><rect fill="#DCE5D7" height="109" rx="17" transform="rotate(-13 36 63)" width="96" x="-12" y="10" /><rect fill="#FFFFFF" height="116" rx="17" stroke="#E7D8CB" stroke-width="1.5" transform="rotate(9 55 58)" width="100" x="6" y="0" /><rect fill="#F3D8C9" height="71" rx="12" transform="rotate(9 55 58)" width="70" x="22" y="15" /><path d="M48 46 C37 31 22 44 31 58 L53 76 L77 55 C84 39 66 31 56 46 L53 50Z" fill="#98543F" stroke="none" transform="rotate(9 55 58)" /><rect fill="#EEDFD4" height="5" rx="3" transform="rotate(9 55 58)" width="44" x="28" y="96" /></g><g fill="none" stroke="#98543F" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" transform="translate(48,253) scale(1.5)"><path d="M5 5h14l2 10v5H3v-5z" /><path d="M3 15h18" /><path d="M9 18h6" /></g><text fill="#3F3530" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="15" font-weight="600" letter-spacing="0" text-anchor="start" x="48" y="315">当前未授权访问文件夹</text><text fill="#857A73" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="11.5" font-weight="400" letter-spacing="0" text-anchor="start" x="48" y="338">通过系统「文件」选择硬盘上的目录。</text><text fill="#857A73" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="600" letter-spacing="0" text-anchor="start" x="24" y="416">你将授权的内容</text><rect fill="#FFFFFF" height="56" opacity="1" rx="19" stroke="#EDE6DE" stroke-width="0.9" width="345" x="24" y="437" /><g fill="none" stroke="#98543F" stroke-linecap=