name: Build and test
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-22.04
    container: swift:6.0.3-jammy
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests (CryptoKit implementation)
        run: swift test
      - name: Build iOS application without signing
        run: xcodebuild -project LunaSync.xcodeproj -scheme LunaSync -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
